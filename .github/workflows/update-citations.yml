name: Update Google Scholar Citations
on:
  schedule:
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citation-update
  cancel-in-progress: false
jobs:
  fetch:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-citations.txt
      - run: python -m pip install --require-hashes -r requirements-citations.txt
      - name: Fetch citations
        run: timeout 90 python bin/update_scholar_citations.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: citations
          path: _data/citations.yml
          if-no-files-found: error
          retention-days: 1
  commit:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: citations
          path: _data
      - name: Commit updated citation data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add _data/citations.yml
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Google Scholar citations"
            git -c credential.helper='!gh auth git-credential' push origin HEAD:master
          fi
  deploy:
    needs: commit
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      publish-citations: true
