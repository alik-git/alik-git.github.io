name: Update Google Scholar Citations
on:
  schedule:
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citation-update
  cancel-in-progress: false
jobs:
  fetch:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-citations.txt
      - run: python -m pip install --require-hashes -r requirements-citations.txt
      - name: Fetch citations
        run: timeout 90 python bin/update_scholar_citations.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: citations
          path: _data/citations.yml
          if-no-files-found: error
          retention-days: 1
  commit:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: citations
          path: _data
      - name: Commit updated citation data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add _data/citations.yml
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Google Scholar citations"
            git -c credential.helper='!gh auth git-credential' push origin HEAD:master
          fi
  deploy:
    needs: commit
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      publish-citations: true
