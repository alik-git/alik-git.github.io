name: Update Google Scholar Citations
on:
  schedule:
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citation-update
  cancel-in-progress: false
jobs:
  fetch:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-citations.txt
      - run: python -m pip install --require-hashes -r requirements-citations.txt
      - name: Check citation cache recovery
        run: python -m unittest discover -s test -p 'test_citations.py'
      - name: Fetch citations
        run: timeout 90 python bin/update_scholar_citations.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: citations
          path: _data/citations.yml
          if-no-files-found: error
          retention-days: 1
  commit:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: citations
          path: _data
      - name: Commit updated citation data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add _data/citations.yml
          if ! git diff --staged --quiet; then
            git commit -m "chore: update Google Scholar citations"
            git -c credential.helper='!gh auth git-credential' push origin HEAD:master
          fi
  deploy:
    needs: commit
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      publish-citations: true
