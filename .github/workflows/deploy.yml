name: Deploy site
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish-citations:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.publish-citations && 'master' || github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --require-hashes -r requirements-build.txt
          npm ci
          npm run lint:prettier
      - name: Check upgrade and override drift
        run: |
          bundle exec al-folio upgrade audit
          bundle exec ruby test/runtime_smoke.rb
          bundle exec al-folio upgrade overrides audit --fail-on-stale
      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Check generated site and browser behavior
        run: |
          python bin/check_site.py _site
          npx --no-install playwright install --with-deps chromium
          npm run test:site
      - name: Check local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          lycheeVersion: v0.24.2
          args: --offline --root-dir "${{ github.workspace }}/_site" --no-progress '_site/**/*.html'
      - name: Upload preview build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-build
          path: _site/
          include-hidden-files: true
          retention-days: 7
  publish:
    needs: build
    if: >-
      github.repository == 'alik-git/alik-git.github.io' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.workflow == 'Deploy site') ||
       (inputs.publish-citations && github.workflow == 'Update Google Scholar Citations' && github.ref == 'refs/heads/master' &&
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: site-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-build
          path: _site
      - name: Publish the verified static build
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          token: ${{ github.token }}
          branch: gh-pages
          folder: _site
