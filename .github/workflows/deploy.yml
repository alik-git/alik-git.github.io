name: Deploy site
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      publish-citations:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.publish-citations && 'master' || github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install --require-hashes -r requirements-build.txt
          npm ci
          npm run lint:prettier
      - name: Check upgrade and override drift
        run: |
          bundle exec al-folio upgrade audit
          bundle exec ruby test/runtime_smoke.rb
          bundle exec al-folio upgrade overrides audit --fail-on-stale
      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Check generated site and browser behavior
        run: |
          python bin/check_site.py _site
          npx --no-install playwright install --with-deps chromium
          npm run test:site
      - name: Check local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          lycheeVersion: v0.24.2
          args: --offline --root-dir "${{ github.workspace }}/_site" --no-progress '_site/**/*.html'
      - name: Upload preview build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: _site/
          include-hidden-files: true
          retention-days: 7
  publish:
    needs: build
    if: >-
      github.repository == 'alik-git/alik-git.github.io' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.workflow == 'Deploy site') ||
       (inputs.publish-citations && github.workflow == 'Update Google Scholar Citations' && github.ref == 'refs/heads/master' &&
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: site-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: _site
      - name: Publish the verified static build
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          token: ${{ github.token }}
          branch: gh-pages
          folder: _site
